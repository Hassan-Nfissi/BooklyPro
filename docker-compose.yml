services:
  postgres:
    image: postgres:16-alpine
    container_name: booklypro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booklypro}
      POSTGRES_USER: ${POSTGRES_USER:-booklypro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booklypro_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booklypro} -d ${POSTGRES_DB:-booklypro}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: booklypro-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-booklypro}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-booklypro}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-booklypro_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-sample-google-client-id.apps.googleusercontent.com}
      APP_UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,https://${DOMAIN_NAME:-booklypro.duckdns.org}}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-sample-google-client-id.apps.googleusercontent.com}
    container_name: booklypro-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
